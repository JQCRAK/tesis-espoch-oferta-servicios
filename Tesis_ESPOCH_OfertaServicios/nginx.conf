server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas del SPA — redirige todo a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logos e imágenes institucionales (carpeta public/img): mantienen el
    # mismo nombre al reemplazarse, así que se revalidan en cada visita
    # para que un logo nuevo se vea sin limpiar la caché del navegador.
    location ^~ /img/ {
        add_header Cache-Control "no-cache";
    }

    # Cache de assets estáticos (JS/CSS con hash en el nombre)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}