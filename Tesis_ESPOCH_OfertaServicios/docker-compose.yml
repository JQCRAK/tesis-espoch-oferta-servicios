services:

  # ── BACKEND (Node.js / Express) ──────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: portal_graduados_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    # Carga TODAS las variables del .env al contenedor automáticamente.
    # Así, cualquier variable que agregues al .env (ej. MONGO_URI_ORIGEN,
    # RESEND_API_KEY, etc.) llega al backend sin tener que listar aquí
    # una por una — evita el error "variable no definida" cuando el .env
    # crece con nuevas integraciones.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
    volumes:
      # Persisten los archivos subidos y los respaldos automáticos,
      # para que NO se borren al recrear el contenedor.
      - backend_uploads:/app/src/uploads
      - backend_backups:/app/uploads
    networks:
      - portal_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── FRONTEND (React + Nginx) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_BASE_URL: ${VITE_BASE_URL}
    container_name: portal_graduados_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - portal_net

networks:
  portal_net:
    driver: bridge

volumes:
  backend_uploads:
  backend_backups: