services:

  # ── BASE DE DATOS (MongoDB local) ────────────────────
  # Solo accesible dentro de la red de Docker (portal_net).
  # No se publica ningún puerto al host por seguridad —
  # el backend se conecta usando el nombre del servicio "mongo".
  mongo:
    image: mongo:7
    container_name: portal_graduados_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - portal_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── BACKEND (Node.js / Express) ──────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: portal_graduados_backend
    restart: unless-stopped
    ports:
      - "8351:8351"
    # Carga TODAS las variables del .env al contenedor automáticamente.
    # Así, cualquier variable que agregues al .env llega al backend
    # sin tener que listar aquí una por una.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8351
    volumes:
      # Persisten las imágenes subidas (graduados/eventos/noticias) y
      # los respaldos automáticos, para que NO se borren al recrear
      # el contenedor.
      - backend_uploads:/app/src/uploads
      - backend_backups:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - portal_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8351/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── FRONTEND (React + Nginx) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_BASE_URL: ${VITE_BASE_URL}
    container_name: portal_graduados_frontend
    restart: unless-stopped
    ports:
      - "8350:80"
    depends_on:
      - backend
    networks:
      - portal_net

networks:
  portal_net:
    driver: bridge

volumes:
  backend_uploads:
  backend_backups:
  mongo_data:
